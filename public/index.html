            category: "Plumbing Service",
            serviceId: "plumbing",
            problems: ["Ruptured CPVC pipe / joint leak", "Water damage hazard", "Pressure seal failure"],
            suggestedAction: "Shut off the main inlet valve immediately to prevent floor seepage. We've matched emergency plumbers within 2 km.",
            urgency: "HIGH - Emergency",
            followUp: "Where is the leak located?",
            options: ["Under kitchen sink", "Bathroom shower/faucet", "Main water meter pipe", "Ceiling dampness"],
            pros: PROFESSIONALS.filter(p => p.service === "Plumbing")

          sender: "customer",
          text: msgText.trim(),
          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
          status: "sent"

                          value={userEmergencyContact} 
                          onChange={e => setUserEmergencyContact(e.target.value)}
                          className="w-full p-3 text-xs sm:text-sm bg-slate-50 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-600 font-semibold"
                        />
                      </div>
                    </div>
                  ) : (
                    /* SERVICE PROFESSIONAL FORM */
                    <div className="space-y-4">
                      <div className="p-3 bg-amber-50 rounded-xl border border-amber-200 text-amber-900 text-xs">
                        <strong>Logged in as:</strong> Ramesh Kumar (Member ID: KRN-8821 • Certified Plumber)
                      </div>

                      {/* Availability switch */}
                      <div className="flex items-center justify-between p-3 bg-slate-50 rounded-xl border border-slate-200">
                        <div>
                          <p className="font-bold text-xs text-slate-900">Instant Availability Status</p>
                          <p className="text-[11px] text-slate-500">Appear in emergency dispatch and live searches</p>
                        </div>
                        <button 
                          onClick={() => setProOnline(!proOnline)}
                          className={`px-3 py-1.5 rounded-full text-xs font-bold transition ${proOnline ? "bg-green-100 text-green-800 border border-green-300" : "bg-slate-200 text-slate-600"}`}
                        >
                          {proOnline ? "● Available Now" : "○ Busy"}
                        </button>
                      </div>

                      {/* Working Hours */}
                      <div>
                        <label className="block text-xs font-bold text-slate-700 mb-1">Working Hours</label>
                        <input 
                          type="text" 
                          value={proHours} 
                          onChange={e => setProHours(e.target.value)}
                          className="w-full p-3 text-xs sm:text-sm bg-slate-50 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-600 font-semibold"
                        />
                        <div className="flex flex-wrap gap-1.5 mt-2">
                          {["24x7 Emergency Service", "7:00 AM - 9:00 PM (All Days)", "8:00 AM - 7:00 PM (Mon-Sat)"].map((hrs, idx) => (
                            <button 
                              key={idx}
                              onClick={() => setProHours(hrs)}
                              className="text-[11px] bg-slate-100 hover:bg-teal-50 hover:text-teal-800 text-slate-600 px-2.5 py-1 rounded-lg border border-slate-200 transition font-medium"
                            >
                              {hrs}
                            </button>
                          ))}
                        </div>
                      </div>

                      {/* Service Area */}
                      <div>
                        <label className="block text-xs font-bold text-slate-700 mb-1">Service Coverage Area ({city})</label>
                        <input 
                          type="text" 
                          value={proAreas} 
                          onChange={e => setProAreas(e.target.value)}
                          className="w-full p-3 text-xs sm:text-sm bg-slate-50 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-600 font-semibold"
                        />
                        <p className="text-[11px] text-slate-400 mt-1">Add quick localities:</p>
                        <div className="flex flex-wrap gap-1.5 mt-1">
                          {["Koramangala", "HSR Layout", "Indiranagar", "BTM Layout", "Jayanagar", "Whitefield"].map((area, idx) => (
                            <button 
                              key={idx}
                              onClick={() => {
                                if (!proAreas.includes(area)) {
                                  setProAreas(prev => prev ? `${prev}, ${area}` : area);
                                }
                              }}
                              className="text-[11px] bg-slate-100 hover:bg-blue-50 hover:text-blue-700 text-slate-600 px-2.5 py-0.5 rounded-md border border-slate-200 transition font-medium"
                            >
                              + {area}
                            </button>
                          ))}
                        </div>
                      </div>

                      {/* Base Fee */}
                      <div>
                        <label className="block text-xs font-bold text-slate-700 mb-1">Base Inspection & Visit Fee (₹)</label>
                        <input 
                          type="number" 
                          value={proRate} 
                          onChange={e => setProRate(Number(e.target.value))}
                          className="w-full p-3 text-xs sm:text-sm bg-slate-50 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-600 font-bold text-blue-700"
                        />
                        <p className="text-[10px] text-slate-400 mt-1">Standard cooperative minimum rate: ₹199</p>
                      </div>
                    </div>
                  )}

                  {/* Save Button */}
                  <div className="pt-2">
                    <button 
                      onClick={() => {
                        setBookingAddress(userAddress);
                        setProfileToast(true);
                        setTimeout(() => setProfileToast(false), 3000);
                      }}
                      className="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs sm:text-sm rounded-xl shadow-md transition flex items-center justify-center gap-2"
                    >
                      <span>💾 Save Profile Changes</span>
                    </button>
                  </div>

                  {profileToast && (
                    <div className="p-3 bg-green-50 border border-green-200 text-green-800 text-xs font-bold rounded-xl text-center">
                      ✓ Profile details and preferences updated successfully!
                    </div>
                  )}
                </div>
              </div>
            )}

          </main>

          {/* REVIEW MODAL */}
          {reviewModal && (
            <div className="fixed inset-0 z-50 bg-black/50 backdrop-blur-xs flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl p-6 max-w-sm w-full space-y-4 shadow-2xl">
                <h3 className="text-base font-bold text-slate-900">How was your service with Ramesh?</h3>
                <p className="text-xs text-slate-500">Your feedback helps improve our worker cooperative quality.</p>
                
                <div className="flex justify-center gap-2 text-2xl py-2">
                  {[1, 2, 3, 4, 5].map(star => (
                    <button key={star} onClick={() => setReviewScore(star)} className={star <= reviewScore ? "text-amber-400" : "text-slate-200"}>
                      ★
                    </button>
                  ))}
                </div>

                <textarea 
                  value={reviewText}
                  onChange={e => setReviewText(e.target.value)}
                  placeholder="Share a short review about punctuality and workmanship..." 
                  className="w-full h-20 p-3 text-xs bg-slate-50 rounded-xl border border-slate-200 focus:outline-none"
                ></textarea>

                <div className="flex gap-2">
                  <button onClick={() => setReviewModal(false)} className="flex-1 py-2 text-xs font-semibold text-slate-600 bg-slate-100 rounded-xl">Skip</button>
                  <button onClick={() => setReviewModal(false)} className="flex-1 py-2 text-xs font-bold text-white bg-blue-600 rounded-xl shadow-xs">Submit</button>
                </div>
              </div>
            </div>
          )}

          {/* BOTTOM NAVIGATION (MOBILE) */}
          <nav className="fixed bottom-0 left-0 right-0 z-40 bg-white border-t border-slate-200 flex justify-around items-center py-2 px-3 shadow-lg md:hidden">
            {[
              { id: "home", label: "Home", icon: "🏠" },
              { id: "services", label: "Services", icon: "🔧" },
              { id: "ai_assistant", label: "AI Assist", icon: "✨" },
              { id: "chat", label: "Chat", icon: "💬" },
              { id: "my_bookings", label: "Bookings", icon: "📋" },
              { id: "profile_editor", label: "Profile", icon: "👤" }
            ].map(tab => (
              <button 
                key={tab.id}
                onClick={() => setCurrentRoute(tab.id)}
                className={`flex flex-col items-center py-1 px-2 text-[10px] font-semibold transition ${
                  currentRoute === tab.id ? "text-blue-600 font-bold" : "text-slate-400 hover:text-slate-600"
                }`}
              >
                <span className="text-base">{tab.icon}</span>
                <span>{tab.label}</span>
              </button>
            ))}
          </nav>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>

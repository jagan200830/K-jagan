    // --- 3D CORPORATE TECHNOLOGY BACKGROUND COMPONENT ---
    function Corporate3DBackground() {
      const mountRef = useRef(null);

      useEffect(() => {
        const container = mountRef.current;
        if (!container || typeof THREE === "undefined") return;

        // Check prefers-reduced-motion
        const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        // Scene setup
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x070e20, 0.022);

        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 36);

        let renderer;
        try {
          renderer = new THREE.WebGLRenderer({
            antialias: true,
            alpha: true,
            powerPreference: "high-performance"
          });
        } catch (e) {
          console.warn("WebGL initialization failed, falling back to CSS background", e);
          return;
        }

        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.75));
        renderer.setClearColor(0x070d1e, 1);
        container.appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0x0f274a, 1.4);
        scene.add(ambientLight);

        const keyLight = new THREE.DirectionalLight(0x38bdf8, 2.2);
        keyLight.position.set(15, 25, 20);
        scene.add(keyLight);

        const rimLight = new THREE.PointLight(0x06b6d4, 2.8, 80);
        rimLight.position.set(-18, -12, 10);
        scene.add(rimLight);

        const fillLight = new THREE.DirectionalLight(0x1e3a8a, 1.2);
        fillLight.position.set(-15, -20, -10);
        scene.add(fillLight);

        // Group for all floating 3D service elements
        const worldGroup = new THREE.Group();
        scene.add(worldGroup);

        // 1. NETWORK NODES & SMART DISPATCH MESH
        const nodeCount = 45;
        const nodeGeometry = new THREE.SphereGeometry(0.24, 16, 16);
        const nodeMaterial = new THREE.MeshStandardMaterial({
          color: 0x38bdf8,
          emissive: 0x0284c7,
          emissiveIntensity: 0.6,
          metalness: 0.8,
          roughness: 0.2
        });

        const nodePositions = [];
        const nodes = [];
        for (let i = 0; i < nodeCount; i++) {
          const node = new THREE.Mesh(nodeGeometry, nodeMaterial);
          const x = (Math.random() - 0.5) * 60;
          const y = (Math.random() - 0.5) * 36;
          const z = (Math.random() - 0.5) * 24 - 4;
          node.position.set(x, y, z);
          node.userData = {
            baseX: x, baseY: y, baseZ: z,
            speed: 0.0006 + Math.random() * 0.001,
            phase: Math.random() * Math.PI * 2
          };
          worldGroup.add(node);
          nodes.push(node);
          nodePositions.push(node.position);
        }

        // Interconnecting lines for nearby nodes
        const lineMaterial = new THREE.LineBasicMaterial({
          color: 0x0ea5e9,
          transparent: true,
          opacity: 0.18
        });

        const lineGeo = new THREE.BufferGeometry();
        const linePoints = [];
        for (let i = 0; i < nodeCount; i++) {
          for (let j = i + 1; j < nodeCount; j++) {
            const dist = nodePositions[i].distanceTo(nodePositions[j]);
            if (dist < 12) {
              linePoints.push(nodePositions[i].x, nodePositions[i].y, nodePositions[i].z);
              linePoints.push(nodePositions[j].x, nodePositions[j].y, nodePositions[j].z);
            }
          }
        }
        lineGeo.setAttribute('position', new THREE.Float32BufferAttribute(linePoints, 3));
        const lineSegments = new THREE.LineSegments(lineGeo, lineMaterial);
        worldGroup.add(lineSegments);

        // 2. 3D PLUMBING PIPES & VALVES (Subtle, sleek corporate cylinders and torus elbows)
        const pipeMaterial = new THREE.MeshStandardMaterial({
          color: 0x1e3a8a,
          emissive: 0x075985,
          emissiveIntensity: 0.25,
          metalness: 0.9,
          roughness: 0.2,
          transparent: true,
          opacity: 0.75
        });

        const pipeGroup = new THREE.Group();
        // Pipe 1 (Horizontal with elbow)
        const pipeGeo1 = new THREE.CylinderGeometry(0.35, 0.35, 14, 24);
        const p1 = new THREE.Mesh(pipeGeo1, pipeMaterial);
        p1.rotation.z = Math.PI / 2.8;
        p1.position.set(-18, 9, -6);
        pipeGroup.add(p1);

        // Valve torus
        const torusGeo = new THREE.TorusGeometry(1.2, 0.28, 16, 32);
        const valve = new THREE.Mesh(torusGeo, new THREE.MeshStandardMaterial({
          color: 0x38bdf8,
          metalness: 0.95,
          roughness: 0.15,
          emissive: 0x0369a1,
          emissiveIntensity: 0.4
        }));
        valve.position.set(-14, 12, -4);
        pipeGroup.add(valve);

        // Pipe 2 (Vertical flow)
        const p2 = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 10, 24), pipeMaterial);
        p2.position.set(20, -7, -8);
        p2.rotation.z = -Math.PI / 4;
        pipeGroup.add(p2);

        worldGroup.add(pipeGroup);

        // 3. 3D ELECTRICAL CIRCUITS & REPAIR EQUIPMENT (Hex nuts, geometric tool forms, circuit paths)
        const toolMaterial = new THREE.MeshStandardMaterial({
          color: 0x0f172a,
          emissive: 0x1e293b,
          metalness: 0.9,
          roughness: 0.25,
          wireframe: false
        });
        const cyanEdgeMaterial = new THREE.LineBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.4 });

        const serviceObjects = [];
        // Hexagonal repair prisms (Tools & hardware)
        for (let i = 0; i < 6; i++) {
          const hexGeo = new THREE.CylinderGeometry(1.4, 1.4, 0.6, 6);
          const hexMesh = new THREE.Mesh(hexGeo, toolMaterial);
          const edges = new THREE.LineSegments(new THREE.EdgesGeometry(hexGeo), cyanEdgeMaterial);
          hexMesh.add(edges);

          const hx = (i % 2 === 0 ? -1 : 1) * (14 + Math.random() * 12);
          const hy = (Math.random() - 0.5) * 26;
          const hz = (Math.random() - 0.5) * 12 - 2;
          hexMesh.position.set(hx, hy, hz);
          hexMesh.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);
          hexMesh.userData = {
            rotSpeedX: 0.002 * (Math.random() > 0.5 ? 1 : -1),
            rotSpeedY: 0.003 * (Math.random() > 0.5 ? 1 : -1)
          };
          worldGroup.add(hexMesh);
          serviceObjects.push(hexMesh);
        }

        // 4. 3D ISOMETRIC CORPORATE BUILDINGS & RESIDENCES (Clean corporate architectural geometry)
        const buildingMat = new THREE.MeshStandardMaterial({
          color: 0x0b1329,
          roughness: 0.4,
          metalness: 0.8,
          transparent: true,
          opacity: 0.65
        });
        const buildingEdgeMat = new THREE.LineBasicMaterial({ color: 0x60a5fa, transparent: true, opacity: 0.35 });

        const buildingCluster = new THREE.Group();
        const bHeights = [7, 10, 6, 12, 8];
        bHeights.forEach((h, idx) => {
          const bGeo = new THREE.BoxGeometry(2.2, h, 2.2);
          const bMesh = new THREE.Mesh(bGeo, buildingMat);
          const bEdges = new THREE.LineSegments(new THREE.EdgesGeometry(bGeo), buildingEdgeMat);
          bMesh.add(bEdges);
          bMesh.position.set(-24 + idx * 3.2, -14 + h / 2, -12);
          buildingCluster.add(bMesh);
        });
        worldGroup.add(buildingCluster);

        // 5. 3D FLOATING LOGISTICS CUBES & SMART ROUTING NODES
        for (let i = 0; i < 5; i++) {
          const cubeGeo = new THREE.BoxGeometry(1.6, 1.6, 1.6);
          const cubeMat = new THREE.MeshStandardMaterial({
            color: 0x0c2340,
            emissive: 0x0284c7,
            emissiveIntensity: 0.3,
            metalness: 0.85,
            roughness: 0.2,
            transparent: true,
            opacity: 0.8
          });
          const cube = new THREE.Mesh(cubeGeo, cubeMat);
          const cEdges = new THREE.LineSegments(new THREE.EdgesGeometry(cubeGeo), cyanEdgeMaterial);
          cube.add(cEdges);
          cube.position.set(16 + (i * 2), 6 + (i * 2.5) - 4, -4 + (i * 2));
          cube.userData = {
            rotSpeedX: 0.004,
            rotSpeedY: 0.005,
            floatY: cube.position.y
          };
          worldGroup.add(cube);
          serviceObjects.push(cube);
        }

        // Mouse Parallax
        let mouseX = 0;
        let mouseY = 0;
        let targetX = 0;
        let targetY = 0;

        const onMouseMove = (event) => {
          mouseX = (event.clientX / window.innerWidth) * 2 - 1;
          mouseY = -(event.clientY / window.innerHeight) * 2 + 1;
          targetX = mouseX * 2.5;
          targetY = mouseY * 1.8;
        };

        window.addEventListener('mousemove', onMouseMove, { passive: true });

        // Responsive resize
        const onResize = () => {
          if (!renderer || !camera) return;
          camera.aspect = window.innerWidth / window.innerHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(window.innerWidth, window.innerHeight);
        };
        window.addEventListener('resize', onResize);

        // Animation Loop
        let animationFrameId;
        let clock = new THREE.Clock();

        const animate = () => {
          animationFrameId = requestAnimationFrame(animate);

          const delta = clock.getDelta();
          const elapsed = clock.getElapsedTime();

          if (!prefersReducedMotion) {
            // Smooth camera lerp for gentle parallax
            camera.position.x += (targetX - camera.position.x) * 0.04;
            camera.position.y += (targetY - camera.position.y) * 0.04;
            camera.lookAt(0, 0, 0);

            // Subtle rotation of the 3D world
            worldGroup.rotation.y = Math.sin(elapsed * 0.08) * 0.05;
            worldGroup.rotation.x = Math.cos(elapsed * 0.06) * 0.03;

            // Oscillate network nodes
            nodes.forEach(node => {
              const { baseX, baseY, baseZ, speed, phase } = node.userData;
              node.position.y = baseY + Math.sin(elapsed * 1.5 + phase) * 0.5;
              node.position.x = baseX + Math.cos(elapsed * 1.2 + phase) * 0.3;
            });

            // Rotate service objects (hardware tools, logistics cubes)
            serviceObjects.forEach(obj => {
              obj.rotation.x += obj.userData.rotSpeedX || 0.002;
              obj.rotation.y += obj.userData.rotSpeedY || 0.003;
              if (obj.userData.floatY !== undefined) {
                obj.position.y = obj.userData.floatY + Math.sin(elapsed * 1.4) * 0.6;
              }
            });

            // Gentle valve pulsation
            valve.rotation.z += 0.004;
            pipeGroup.rotation.z = Math.sin(elapsed * 0.15) * 0.03;
          }

          renderer.render(scene, camera);
        };

        if (prefersReducedMotion) {
          renderer.render(scene, camera);
        } else {
          animate();
        }

        // Cleanup
        return () => {
          if (animationFrameId) cancelAnimationFrame(animationFrameId);
          window.removeEventListener('mousemove', onMouseMove);
          window.removeEventListener('resize', onResize);
          if (renderer && renderer.domElement && container.contains(renderer.domElement)) {
            container.removeChild(renderer.domElement);
            renderer.dispose();
          }
        };
      }, []);

      return <div id="three-bg-canvas" ref={mountRef} aria-hidden="true" />;
    }

                        <input 
                          type="text" 
                          value={userEmergencyContact} 
                          onChange={e => setUserEmergencyContact(e.target.value)}
                          className="w-full p-3 text-xs sm:text-sm bg-slate-50 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-600 font-semibold"
                        />
                      </div>
                    </div>
                  ) : (
                    /* SERVICE PROFESSIONAL FORM */
                    <div className="space-y-4">
                      <div className="p-3 bg-amber-50 rounded-xl border border-amber-200 text-amber-900 text-xs">
                        <strong>Logged in as:</strong> Ramesh Kumar (Member ID: KRN-8821 • Certified Plumber)
                      </div>

                      {/* Availability switch */}
                      <div className="flex items-center justify-between p-3 bg-slate-50 rounded-xl border border-slate-200">
                        <div>
                          <p className="font-bold text-xs text-slate-900">Instant Availability Status</p>
                          <p className="text-[11px] text-slate-500">Appear in emergency dispatch and live searches</p>
                        </div>
                        <button 
                          onClick={() => setProOnline(!proOnline)}
                          className={`px-3 py-1.5 rounded-full text-xs font-bold transition ${proOnline ? "bg-green-100 text-green-800 border border-green-300" : "bg-slate-200 text-slate-600"}`}
                        >
                          {proOnline ? "● Available Now" : "○ Busy"}
                        </button>
                      </div>

                      {/* Working Hours */}
                      <div>
                        <label className="block text-xs font-bold text-slate-700 mb-1">Working Hours</label>
                        <input 
                          type="text" 
                          value={proHours} 
                          onChange={e => setProHours(e.target.value)}
                          className="w-full p-3 text-xs sm:text-sm bg-slate-50 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-600 font-semibold"
                        />
                        <div className="flex flex-wrap gap-1.5 mt-2">
                          {["24x7 Emergency Service", "7:00 AM - 9:00 PM (All Days)", "8:00 AM - 7:00 PM (Mon-Sat)"].map((hrs, idx) => (
                            <button 
                              key={idx}
                              onClick={() => setProHours(hrs)}
                              className="text-[11px] bg-slate-100 hover:bg-teal-50 hover:text-teal-800 text-slate-600 px-2.5 py-1 rounded-lg border border-slate-200 transition font-medium"
                            >
                              {hrs}
                            </button>
                          ))}
                        </div>
                      </div>

                      {/* Service Area */}
                      <div>
                        <label className="block text-xs font-bold text-slate-700 mb-1">Service Coverage Area ({city})</label>
                        <input 
                          type="text" 
                          value={proAreas} 
                          onChange={e => setProAreas(e.target.value)}
                          className="w-full p-3 text-xs sm:text-sm bg-slate-50 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-600 font-semibold"
                        />
                        <p className="text-[11px] text-slate-400 mt-1">Add quick localities:</p>
                        <div className="flex flex-wrap gap-1.5 mt-1">
                          {["Koramangala", "HSR Layout", "Indiranagar", "BTM Layout", "Jayanagar", "Whitefield"].map((area, idx) => (
                            <button 
                              key={idx}
                              onClick={() => {
                                if (!proAreas.includes(area)) {
                                  setProAreas(prev => prev ? `${prev}, ${area}` : area);
                                }
                              }}
                              className="text-[11px] bg-slate-100 hover:bg-blue-50 hover:text-blue-700 text-slate-600 px-2.5 py-0.5 rounded-md border border-slate-200 transition font-medium"
                            >
                              + {area}
                            </button>
                          ))}
                        </div>
                      </div>

                      {/* Base Fee */}
                      <div>
                        <label className="block text-xs font-bold text-slate-700 mb-1">Base Inspection & Visit Fee (₹)</label>
                        <input 
                          type="number" 
                          value={proRate} 
                          onChange={e => setProRate(Number(e.target.value))}
                          className="w-full p-3 text-xs sm:text-sm bg-slate-50 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-600 font-bold text-blue-700"
                        />
                        <p className="text-[10px] text-slate-400 mt-1">Standard cooperative minimum rate: ₹199</p>
                      </div>
                    </div>
                  )}

                  {/* Save Button */}
                  <div className="pt-2">
                    <button 
                      onClick={() => {
                        setBookingAddress(userAddress);
                        setProfileToast(true);
                        setTimeout(() => setProfileToast(false), 3000);
                      }}
                      className="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs sm:text-sm rounded-xl shadow-md transition flex items-center justify-center gap-2"
                    >
                      <span>💾 Save Profile Changes</span>
                    </button>
                  </div>

                  {profileToast && (
                    <div className="p-3 bg-green-50 border border-green-200 text-green-800 text-xs font-bold rounded-xl text-center">
                      ✓ Profile details and preferences updated successfully!
                    </div>
                  )}
                </div>
              </div>
            )}

          </main>

          {/* REVIEW MODAL */}
          {reviewModal && (
            <div className="fixed inset-0 z-50 bg-black/50 backdrop-blur-xs flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl p-6 max-w-sm w-full space-y-4 shadow-2xl">
                <h3 className="text-base font-bold text-slate-900">How was your service with Ramesh?</h3>
                <p className="text-xs text-slate-500">Your feedback helps improve our worker cooperative quality.</p>
                
                <div className="flex justify-center gap-2 text-2xl py-2">
                  {[1, 2, 3, 4, 5].map(star => (
                    <button key={star} onClick={() => setReviewScore(star)} className={star <= reviewScore ? "text-amber-400" : "text-slate-200"}>
                      ★
                    </button>
                  ))}
                </div>

                <textarea 
                  value={reviewText}
                  onChange={e => setReviewText(e.target.value)}
                  placeholder="Share a short review about punctuality and workmanship..." 
                  className="w-full h-20 p-3 text-xs bg-slate-50 rounded-xl border border-slate-200 focus:outline-none"
                ></textarea>

                <div className="flex gap-2">
                  <button onClick={() => setReviewModal(false)} className="flex-1 py-2 text-xs font-semibold text-slate-600 bg-slate-100 rounded-xl">Skip</button>
                  <button onClick={() => setReviewModal(false)} className="flex-1 py-2 text-xs font-bold text-white bg-blue-600 rounded-xl shadow-xs">Submit</button>
                </div>
              </div>
            </div>
          )}

          {/* BOTTOM NAVIGATION (MOBILE - GLASSMORPHISM) */}
          <nav className="fixed bottom-0 left-0 right-0 z-40 glass-header border-t border-slate-800 flex justify-around items-center py-2 px-3 shadow-2xl md:hidden">
            {[
              { id: "home", label: "Home", icon: "🏠" },
              { id: "services", label: "Services", icon: "🔧" },
              { id: "ai_assistant", label: "AI Assist", icon: "✨" },
              { id: "nearby_pros", label: "Nearby", icon: "📍" },
              { id: "my_bookings", label: "Bookings", icon: "📋" },
              { id: "profile_editor", label: "Profile", icon: "👤" }
            ].map(tab => (
              <button 
                key={tab.id}
                onClick={() => setCurrentRoute(tab.id)}
                className={`flex flex-col items-center py-1 px-2 text-[10px] font-semibold transition ${
                  currentRoute === tab.id ? "text-cyan-400 font-bold" : "text-slate-400 hover:text-slate-200"
                }`}
              >
                <span className="text-base">{tab.icon}</span>
                <span>{tab.label}</span>
              </button>
            ))}
          </nav>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
